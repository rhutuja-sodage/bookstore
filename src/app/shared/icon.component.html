<svg
  [attr.width]="size()"
  [attr.height]="size()"
  viewBox="0 0 24 24"
  fill="none"
  stroke="currentColor"
  stroke-width="1.8"
  stroke-linecap="round"
  stroke-linejoin="round"
  aria-hidden="true"
>
  @if (filled()) {
    <path [attr.d]="path()" fill="currentColor" />
  } @else {
    <path [attr.d]="path()" />
  }
</svg>
